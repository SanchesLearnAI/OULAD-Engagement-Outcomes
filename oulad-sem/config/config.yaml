# OULAD "Same Engagement, Different Outcomes" — frozen analysis config
# Copy to config/config.yaml, then compute:
#   shasum -a 256 config/config.yaml > config/config.sha256
# Any change requires a CHANGE_REQUEST.md and a new run_id.

project: oulad-sem
seed: 42
mode: full                     # simulation | full

paths:
  raw_dir: data/raw/oulad
  interim_dir: data/interim
  processed_dir: data/processed
  outputs_dir: outputs
  runs_dir: runs

# Anchor and windows of the main study.  See research/TMA_PRIMARY_PROTOCOL.md.
study:
  anchor: first_tma             # anchor every presentation on its first TMA
  assessment_type: TMA
  min_weight_exclusive: 0.0     # weight must be strictly greater than this
  pre_days: 14                  # observed pre-deadline window d-13 .. d
  post_days: 14                 # observed post-deadline window d+1 .. d+14
  match_on: post_clicks
  tolerance: 0.05
  tolerance_sensitivity: [0.00, 0.10]
  post_days_sensitivity: [21, 28]
  primary_metrics:
    - submitted_by_cutoff
    - submitted_after_due
    - relative_submission_day
    - post_active_days
    - post_longest_inactive_run
    - post_week2_share
  multiple_testing: holm

cohort:
  positive_class: fail           # Fail=1, Pass/Distinction=0
  exclude_withdrawn: true        # binary comparison excludes Withdrawn
  require_final_result: true
  min_post_clicks: 0             # sensitivity only: 5 / 10 / 20

leakage:
  include_scores: false          # strict main analysis
  assert_no_future: true         # no event or submission after d+post_days
  assert_group_split: true        # one student never spans train and test

features:
  families: [pre_volume, post_volume, post_timing, submission, post_resources]
  log1p: true

splits:
  group_key: id_student
  test_size: 0.2
  val_size: 0.2
  n_splits: 5
  temporal_train: [2013B, 2013J]
  temporal_test: [2014B, 2014J]

clustering:
  k_range: [2, 5]
  n_init: 10
  bootstrap: 3                   # 80% resamples for the stability ARI
  max_pairs: 800
  ari_threshold: 0.60

# Third work segment: exploratory blocks C1-C4.  They never touch the primary
# indicators or the primary model; each writes t11_x_* / t13_* tables.
exploration:
  background_balance: true          # C1 pre-entry covariates of the pairs
  rematching_uncertainty: true      # C2 resample-then-repair interval
  rematching_repeats: 20            # capped: every replicate re-runs the pairing
  heterogeneity: true               # C2 random-effects summary per presentation
  non_submitters: true              # C3 records without a submission by d+14
  at_risk_warning: true             # C4 Fail-or-Withdrawn in the at-risk set

models:
  ladder: [M0, M1, M2, M3, M4]
  primary_model: M2              # M1 + submission distance, no scores
  upper_bound_model: M4          # adds the first-TMA score; retrospective only
  rf_models: [M0, M2]
  primary_metric: pr_auc
  threshold_rule: max_f1         # validation-set maximum F1
  precision_target: 0.80         # used only if reachable on validation
  calibration_bins: 10
  label_permutations: 20

logging:
  level: INFO
  jsonl: true
  flush_each_event: true
