# OULAD "Same Engagement, Different Outcomes" — frozen analysis config
# Copy to config/config.yaml, then compute:
#   shasum -a 256 config/config.yaml > config/config.sha256
# Any change requires a CHANGE_REQUEST.md and a new run_id.

project: oulad-sem
seed: 42
mode: full                     # simulation | full

paths:
  raw_dir: data/raw/oulad
  interim_dir: data/interim
  processed_dir: data/processed
  outputs_dir: outputs
  runs_dir: runs

cohort:
  target: T1                   # T1 | T2 | T3
  positive_class: fail         # T1: Fail=1, Pass/Distinction=0 (early-warning direction)
  exclude_withdrawn: true      # T1: Pass/Distinction vs Fail, Withdrawn excluded
  at_risk_at_cutoff: false     # main cohort keeps all T1
  at_risk_sensitivity: true    # at-risk filter is a sensitivity only
  min_w1_clicks: 0             # sensitivity: 5 / 10 / 20
  require_final_result: true

windows:
  day0: 0
  w1_end: 27                   # W1 = 0..27
  w2_end: 55                   # W2 = 28..55, unless first_tma is earlier
  use_first_assessment: true
  first_assessment_types: [TMA, CMA]
  pre_start: exclude           # exclude | clip | feature
  cutoffs: [7, 14, 21, 28, 35, 42, 49, 56]   # LEAP-style weekly cutoffs

leakage:
  include_scores: false        # strict main analysis
  include_quiz_sites: false
  exclude_banked: true
  assert_no_future: true
  assert_group_split: true

features:
  families: [volume, composition, breadth, regularity, timing, change]
  log1p: true
  winsorize: [0.01, 0.99]
  standardize: within_presentation
  min_active_days_for_clustering: 1

splits:
  group_key: id_student
  test_size: 0.2
  val_size: 0.2
  n_splits: 5
  temporal_train: [2013B, 2013J]
  temporal_test: [2014B, 2014J]

matching:
  method: cem
  exact: [code_module, code_presentation]
  click_bins: 10
  active_day_bins: [0, 1, 4, 8, 15, 22, 29]
  entropy_bins: 3
  smd_threshold: 0.1

clustering:
  k_range: [2, 8]
  n_init: 50
  bootstrap: 300
  ari_threshold: 0.60

models:
  ladder: [M0, M1, M2, M3, M4, M5]
  include_scores_model: M4     # upper bound only, not for early warning
  primary_metric: pr_auc
  recall_precision_target: 0.80
  calibration_bins: 10

logging:
  level: INFO
  jsonl: true
  flush_each_event: true
